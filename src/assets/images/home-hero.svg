<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">خدمات تسهیلاتی سانا</title>
  <desc id="d">بانک، سکه‌ها، قرارداد تأییدشده، کارت اعتباری و نمودار رشد اعتبار پرسنل شرکت‌ها</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A2239"/>
      <stop offset="0.55" stop-color="#0E2B47"/>
      <stop offset="1" stop-color="#17406A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#C99A2E" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C99A2E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D27A"/>
      <stop offset="1" stop-color="#B8891F"/>
    </linearGradient>
    <linearGradient id="goldSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A6214"/>
      <stop offset="0.5" stop-color="#C99A2E"/>
      <stop offset="1" stop-color="#8A6214"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE4EE"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B78B5"/>
      <stop offset="1" stop-color="#17406A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020a14" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- پس‌زمینه -->
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="560" rx="28" fill="url(#glow)"/>
  <g stroke="#FFFFFF" stroke-opacity="0.05">
    <path d="M0 120H1200M0 240H1200M0 360H1200M0 480H1200"/>
    <path d="M150 0V560M300 0V560M450 0V560M600 0V560M750 0V560M900 0V560M1050 0V560"/>
  </g>
  <circle cx="1080" cy="90" r="6" fill="#E8C56A" opacity="0.7"/>
  <circle cx="140" cy="80" r="4" fill="#E8C56A" opacity="0.5"/>
  <circle cx="620" cy="60" r="3" fill="#FFFFFF" opacity="0.4"/>

  <!-- زمین -->
  <ellipse cx="600" cy="500" rx="520" ry="34" fill="#020a14" opacity="0.35"/>

  <!-- ساختمان بانک (وسط) -->
  <g filter="url(#shadow)">
    <path d="M420 200 L600 110 L780 200 Z" fill="url(#stone)"/>
    <path d="M454 196 L600 124 L746 196 Z" fill="#E9EEF5"/>
    <circle cx="600" cy="166" r="20" fill="url(#gold)"/>
    <path d="M600 154 L611 166 L600 178 L589 166 Z" fill="#0E2B47"/>
    <rect x="430" y="200" width="340" height="22" rx="4" fill="#FFFFFF"/>
    <g fill="url(#stone)">
      <rect x="452" y="232" width="34" height="196" rx="5"/>
      <rect x="518" y="232" width="34" height="196" rx="5"/>
      <rect x="648" y="232" width="34" height="196" rx="5"/>
      <rect x="714" y="232" width="34" height="196" rx="5"/>
    </g>
    <rect x="574" y="300" width="52" height="128" rx="26" fill="#17406A"/>
    <rect x="574" y="300" width="52" height="128" rx="26" fill="none" stroke="#C99A2E" stroke-width="3"/>
    <rect x="420" y="428" width="360" height="22" rx="4" fill="#FFFFFF"/>
    <rect x="404" y="450" width="392" height="26" rx="6" fill="#DCE4EE"/>
  </g>

  <!-- سکه‌ها (چپ) -->
  <g filter="url(#shadow)">
    <g>
      <rect x="150" y="402" width="120" height="22" rx="11" fill="url(#goldSide)"/>
      <rect x="150" y="380" width="120" height="22" rx="11" fill="url(#goldSide)"/>
      <rect x="150" y="358" width="120" height="22" rx="11" fill="url(#goldSide)"/>
      <rect x="150" y="336" width="120" height="22" rx="11" fill="url(#goldSide)"/>
      <ellipse cx="210" cy="336" rx="60" ry="15" fill="url(#gold)"/>
    </g>
    <g>
      <rect x="250" y="424" width="110" height="22" rx="11" fill="url(#goldSide)"/>
      <rect x="250" y="402" width="110" height="22" rx="11" fill="url(#goldSide)"/>
      <ellipse cx="305" cy="402" rx="55" ry="14" fill="url(#gold)"/>
    </g>
    <g transform="translate(110 250) rotate(-14)">
      <circle r="44" fill="url(#gold)"/>
      <circle r="34" fill="none" stroke="#8A6214" stroke-width="3" opacity="0.6"/>
      <path d="M0 -17 L15 0 L0 17 L-15 0 Z" fill="#8A6214" opacity="0.85"/>
    </g>
  </g>

  <!-- قرارداد تأییدشده (چپ بالا) -->
  <g transform="translate(250 130) rotate(-6)" filter="url(#shadow)">
    <rect width="150" height="190" rx="14" fill="#FFFFFF"/>
    <rect x="22" y="28" width="80" height="10" rx="5" fill="#0E2B47"/>
    <rect x="22" y="52" width="106" height="7" rx="3.5" fill="#CBD3DF"/>
    <rect x="22" y="68" width="96" height="7" rx="3.5" fill="#CBD3DF"/>
    <rect x="22" y="84" width="106" height="7" rx="3.5" fill="#CBD3DF"/>
    <rect x="22" y="100" width="70" height="7" rx="3.5" fill="#CBD3DF"/>
    <path d="M24 152c14-12 22 6 34-6s18 4 28-4" stroke="#17406A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="118" cy="150" r="22" fill="#12805C"/>
    <path d="M107 150l8 8 15-16" stroke="#FFFFFF" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- کارت اعتباری (راست) -->
  <g transform="translate(840 300) rotate(8)" filter="url(#shadow)">
    <rect width="230" height="140" rx="16" fill="url(#card)"/>
    <rect x="20" y="30" width="42" height="32" rx="6" fill="url(#gold)"/>
    <path d="M20 46h42M41 30v32" stroke="#8A6214" stroke-width="1.5" opacity="0.7"/>
    <rect x="20" y="88" width="34" height="8" rx="4" fill="#FFFFFF" opacity="0.85"/>
    <rect x="62" y="88" width="34" height="8" rx="4" fill="#FFFFFF" opacity="0.85"/>
    <rect x="104" y="88" width="34" height="8" rx="4" fill="#FFFFFF" opacity="0.85"/>
    <rect x="146" y="88" width="34" height="8" rx="4" fill="#FFFFFF" opacity="0.85"/>
    <rect x="20" y="110" width="80" height="7" rx="3.5" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="186" cy="38" r="14" fill="#E8C56A" opacity="0.9"/>
    <circle cx="204" cy="38" r="14" fill="#C99A2E" opacity="0.9"/>
  </g>

  <!-- نمودار رشد اعتبار (راست بالا) -->
  <g transform="translate(860 110)" filter="url(#shadow)">
    <rect width="230" height="160" rx="16" fill="#FFFFFF"/>
    <rect x="24" y="22" width="70" height="9" rx="4.5" fill="#0E2B47"/>
    <g fill="#3B78B5">
      <rect x="30" y="104" width="24" height="34" rx="4"/>
      <rect x="70" y="86" width="24" height="52" rx="4"/>
      <rect x="110" y="70" width="24" height="68" rx="4"/>
    </g>
    <rect x="150" y="50" width="24" height="88" rx="4" fill="#C99A2E"/>
    <path d="M30 96 L82 76 L122 60 L184 36" stroke="#12805C" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M172 32 L188 34 L184 50" stroke="#12805C" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24 138h182" stroke="#E3E8F0" stroke-width="2"/>
  </g>

  <!-- پرسنل (راست پایین) -->
  <g transform="translate(1000 452)">
    <g fill="#E8C56A">
      <circle cx="0" cy="-58" r="16"/>
      <path d="M-28 0c0-26 12-38 28-38s28 12 28 38z"/>
    </g>
    <g fill="#FFFFFF" opacity="0.92">
      <circle cx="-56" cy="-46" r="13"/>
      <path d="M-78 0c0-21 9-30 22-30s22 9 22 30z"/>
      <circle cx="56" cy="-46" r="13"/>
      <path d="M34 0c0-21 9-30 22-30s22 9 22 30z"/>
    </g>
  </g>

  <!-- اتصال‌ها -->
  <g stroke="#E8C56A" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round" fill="none" opacity="0.75">
    <path d="M405 230 C 430 230 440 250 452 260"/>
    <path d="M780 260 C 810 240 830 230 858 210"/>
    <path d="M780 380 C 805 380 820 372 842 360"/>
  </g>
</svg>
